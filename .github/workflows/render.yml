name: Vorschaubild rendern

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/**"
      - ".github/workflows/render.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten
        run: pip install amulet-core pillow numpy

      - name: Rendern
        run: |
          mkdir -p welt vorschau
          unzip -oq "ergebnis/Arnis Torgau.mcworld" -d welt
          python tools/render_side.py welt vorschau/schloss 690 850 540 690 2>&1 | tee vorschau/render_side_log.txt

      - name: Ins Repo legen
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add vorschau
          git commit -m "Vorschau ${{ github.run_id }} [skip ci]" || true
          git push
