name: Torgau Minecraft-Welt bauen

on:
  workflow_dispatch:
    inputs:
      bbox:
        description: "Gebiet: min_lat,min_lng,max_lat,max_lng"
        default: "51.5555,12.9975,51.5645,13.0130"
  push:
    paths:
      - ".github/workflows/torgau.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Arnis holen
        run: git clone --depth 1 https://github.com/louis-e/arnis.git

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: arnis

      - name: Arnis bauen (nur Kommandozeile)
        working-directory: arnis
        run: cargo build --release --no-default-features

      - name: Torgau generieren (Bedrock)
        working-directory: arnis
        run: |
          mkdir -p ../out
          set -o pipefail
          ./target/release/arnis --bedrock \
            --bbox="${{ github.event.inputs.bbox || '51.5555,12.9975,51.5645,13.0130' }}" \
            --output-dir "$(realpath ../out)" 2>&1 | tee ../out/log.txt
          ls -la ../out | tee -a ../out/log.txt

      - name: Ergebnis ins Repo legen
        if: always()
        run: |
          mkdir -p ergebnis
          cp out/* ergebnis/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ergebnis
          git commit -m "Ergebnis ${{ github.run_id }} [skip ci]" || true
          git push
